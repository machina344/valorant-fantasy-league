<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant Fantasy League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: broadcast-desk tab bar over one scrolling column; cards in an auto-fill grid; the pack reveal is the one loud moment */
  --ink:#0f131b; --panel:#171d29; --panel2:#1d2433; --line:#2a3447; --text:#e7ebf2; --muted:#8b97ab;
  --signal:#f2a33a; --ai:#63c3d3; --win:#5fd08a; --loss:#ef6a5b;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ink) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{max-width:960px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--signal)}
.wallet{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.wallet b{color:var(--signal);font-weight:600}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 11px 9px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--text);border-bottom-color:var(--signal)}
nav.tabs button:disabled{opacity:.35;cursor:not-allowed}

main{max-width:960px;margin:0 auto;padding:18px 16px 40px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:900;font-size:30px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:18px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#1a1205}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.t0{color:#b9c2d0}.pill.t1{color:var(--ai);border-color:color-mix(in srgb,var(--ai) 40%,var(--line))}
.pill.t2{color:#b8a6ff;border-color:#4a4278}.pill.t3{color:var(--signal);border-color:color-mix(in srgb,var(--signal) 45%,var(--line))}
.pill.you{color:#1a1205;background:var(--signal);border-color:var(--signal)}

/* create club */
.create{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:start}
.crest-big{display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:10px;padding:16px;aspect-ratio:1}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.search{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 11px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--ink) inset}
.shapes{display:flex;gap:6px;flex-wrap:wrap}
.shapes button{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:13px}
.shapes button[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}

.clubhead{display:flex;gap:16px;align-items:center}
.clubhead .meta{display:flex;flex-direction:column;gap:4px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel2);border-radius:8px;padding:10px 12px}
.stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--display);font-weight:900;font-size:26px;line-height:1.1}

/* ---- cards ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.slot{display:flex;flex-direction:column;gap:6px}
.card{--rc:#888;position:relative;border-radius:12px;padding:10px 10px 9px;background:
  linear-gradient(160deg,color-mix(in srgb,var(--rc) 34%,#141925) 0%,#141925 58%,color-mix(in srgb,var(--rc) 18%,#141925) 100%);
  border:1.5px solid color-mix(in srgb,var(--rc) 70%,transparent);display:flex;flex-direction:column;gap:5px;min-height:212px;overflow:hidden;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.card.r-E{box-shadow:inset 0 0 22px color-mix(in srgb,var(--rc) 35%,transparent)}
.card.r-I{background:linear-gradient(160deg,#1c3a44 0%,#151a27 45%,#2d2350 100%);border-color:var(--rc)}
.card.locked{opacity:.6;filter:saturate(.25)}
.c-top{display:flex;justify-content:space-between;align-items:flex-start}
.c-ovr{font-family:var(--display);font-weight:900;font-size:40px;line-height:.85;color:var(--rc)}
.c-ovr small{display:block;font-family:var(--body);font-size:9px;font-weight:600;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.c-role{display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.c-role svg{width:18px;height:18px}
.c-name{font-family:var(--display);font-weight:900;font-size:24px;line-height:1;letter-spacing:.01em;overflow-wrap:anywhere;margin-top:2px}
.c-team{font-size:12px;font-weight:600;color:var(--text);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.c-team .tag{font-family:var(--mono);font-size:11px;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.08)}
.c-ev{font-size:11px;color:var(--muted);line-height:1.25}
.c-ev .star{color:var(--signal)}
.c-attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;margin-top:auto;padding-top:6px;border-top:1px solid rgba(255,255,255,.08);text-align:center}
.c-attrs div{font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.c-attrs b{display:block;font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:600}
.c-rar{position:absolute;right:22px;top:9px;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rc);display:none}
.form{position:absolute;right:10px;top:58px;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.35)}
.form.up{color:var(--win)}.form.down{color:var(--loss)}.form.flat{color:var(--muted)}
.c-acts{display:flex;gap:6px;flex-wrap:wrap}
.c-acts .btn{flex:1}
.empty-slot{border:1.5px dashed var(--line);border-radius:12px;min-height:212px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.slotlabel{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* pack reveal */
.reveal{background:radial-gradient(ellipse at top,color-mix(in srgb,var(--signal) 14%,var(--panel)) 0%,var(--panel) 65%);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.reveal .card{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .35s}
.reveal .card.hidden{transform:rotateY(80deg) scale(.9);opacity:0}
.dup{font-size:11.5px;color:var(--signal);text-align:center}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pack{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.pack::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--pc)}
.pack .nm{font-family:var(--display);font-weight:900;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.pack .odds{font-size:11.5px;color:var(--muted);font-family:var(--mono)}

.filters{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.sel{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:13px}
.chem{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.chem .good{color:var(--win)}.chem .bad{color:var(--loss)}.chem .mid{color:var(--muted)}
.role{display:inline-flex;align-items:center;gap:4px;color:var(--rc)}
.role svg{width:14px;height:14px}

.opp{display:grid;grid-template-columns:40px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.opp:first-child{border-top:0}
.opp .nm{font-weight:600}
.odds2{font-family:var(--mono);font-size:13px;text-align:right;min-width:62px}
.odds2 small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr.me td{background:color-mix(in srgb,var(--signal) 10%,transparent)}
.tcell{display:flex;align-items:center;gap:10px}
.tablewrap{overflow-x:auto}
.feed{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.feed .w{color:var(--win);font-weight:600}.feed .l{color:var(--loss);font-weight:600}

.board{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.board .mapname{text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.side .nm{font-family:var(--display);font-weight:800;font-size:clamp(13px,4.2vw,18px);text-transform:uppercase;letter-spacing:.04em;text-wrap:balance;overflow-wrap:break-word}
.digits{font-family:var(--display);font-weight:900;font-size:72px;line-height:.9;display:flex;gap:14px;align-items:center}
.digits .dash{color:var(--line);font-size:48px}
.digits .lead{color:var(--signal)}
.strip{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.rd{width:14px;height:20px;border-radius:3px;background:var(--loss);opacity:.85;transition:opacity .15s}
.rd.me{background:var(--signal);opacity:1}
.rd.half{margin-left:8px}
.banner{text-align:center;font-family:var(--display);font-weight:900;font-size:34px;text-transform:uppercase;letter-spacing:.04em}
.banner.win{color:var(--win)}.banner.loss{color:var(--loss)}
.delta{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted)}
.delta b{color:var(--text)}
.box th,.box td{padding:6px 6px}
.mvp{font-size:10px;font-weight:700;letter-spacing:.08em;color:#1a1205;background:var(--signal);border-radius:4px;padding:1px 5px;margin-left:6px}
.pill.bo3{color:#1a1205;background:var(--ai);border-color:var(--ai)}
.mapblock{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.maphead{display:flex;justify-content:space-between;font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.05em}
.maphead .lead{color:var(--signal)}
.calls{display:flex;flex-direction:column;gap:3px;max-height:220px;overflow-y:auto;font-size:12.5px}
.ln{display:flex;gap:8px;align-items:baseline;padding:2px 0}
.ln .rnum{color:var(--muted);font-size:11px;min-width:30px}
.ln .who{font-family:var(--mono);font-size:10.5px;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.07)}
.ln.us .who{color:var(--signal)}.ln.them .who{color:var(--loss)}
.ln.good{color:var(--text)}.ln.bad{color:#f1a39a}.ln.warn{color:#e9c46a}.ln.mid{color:var(--muted)}
.coaches{text-align:center;font-size:13px}.coaches b{color:var(--text)}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-weight:600;font-size:14px}
.h2h .sc{font-size:15px;color:var(--muted)}.h2h .wn{color:var(--win)}.h2h .ls{color:var(--loss)}
.c-mx{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.rdx summary{cursor:pointer;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:2px 0}
.rlist{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow-y:auto;font-family:var(--mono);font-size:10.5px;line-height:1.5;padding-top:4px}
.rlist .rw{color:var(--text)}.rlist .rl{color:var(--muted)}
.rlist b{color:var(--signal)}
.pill.bad{color:var(--loss);border-color:var(--loss)}
.fatb{position:absolute;right:10px;top:84px;font-family:var(--mono);font-size:10.5px;color:var(--muted);background:rgba(0,0,0,.35);border-radius:4px;padding:1px 5px}
.fatb.bad{color:var(--loss)}
.pmrow{display:grid;grid-template-columns:22px 1fr auto 56px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
.pmrow:first-child{border-top:0}
.pmrow .pr{text-align:right}
.readline{font-size:13px;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;color:var(--text);font:inherit;font-weight:600;text-align:left;cursor:pointer;text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:3px}
.linkish.dim{color:var(--muted)}
.fixt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.fixt:first-child{border-top:0}
.fixt .fw{min-width:72px;font-size:11.5px}
.pmsub{font-family:var(--mono);font-size:10.5px;color:var(--muted);padding:0 0 5px 30px}
.agch{font-size:10px;color:var(--muted)}
.fchg{font-size:11px;margin-left:4px}.fchg.up{color:var(--win)}.fchg.down{color:var(--loss)}
.reveal-hide{opacity:0 !important}
.fade{transition:opacity .35s}

footer{max-width:960px;margin:0 auto;padding:0 16px 40px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}

@media (max-width:620px){
  .create{grid-template-columns:1fr}
  .crest-big{max-width:160px;margin:0 auto}
  .stats{grid-template-columns:repeat(2,1fr)}
  .digits{font-size:56px}
  .opp{grid-template-columns:36px 1fr auto}
  .opp .odds2{grid-column:2;text-align:left}
  .opp .btn{grid-row:1 / span 2;grid-column:3}
  .hide-sm{display:none}
  .brand h1{font-size:18px}
  .wallet{font-size:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .c-name{font-size:21px}
  nav.tabs button{padding:8px 8px 9px;font-size:15.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">

</div></header>
<main id="app"></main>

</footer>

function chemistry(cards){
  const notes=[];let c=0;const cnt={};cards.forEach(p=>cnt[p.r]=(cnt[p.r]||0)+1);
  let flex=cnt.Flex||0;
  for(const r of CORE){
    if(cnt[r])c+=1;
    else if(flex>0){flex--;c+=.5;notes.push(["mid",`Flex player covers ${r}`])}
    else{c-=2;notes.push(["bad",`No ${r}: −2`])}
  }
  if((cnt.Duelist||0)>=3){c-=1;notes.push(["bad","Three or more duelists: −1"])}
  const org={};cards.forEach(p=>{org[p.tn]=(org[p.tn]||0)+1});
  const [topOrg,orgN]=Object.entries(org).sort((a,b)=>b[1]-a[1])[0]||["",0];
  if(orgN>=3){c+=2;notes.push(["good",`${orgN} teammates from ${topOrg}: +2`])}
  else if(orgN===2){c+=1;notes.push(["good",`Duo from ${topOrg}: +1`])}
  const reg={};cards.forEach(p=>{if(p.reg)reg[p.reg]=(reg[p.reg]||0)+1});
  const top=Math.max(0,...Object.values(reg));
  if(top>=5){c+=2;notes.push(["good","Full region synergy: +2"])}
  else if(top>=3){c+=1;notes.push(["good","Region trio: +1"])}
  if(cards.length===5&&CORE.every(r=>cnt[r]))notes.unshift(["good","All four core roles covered"]);
  return{value:c,notes};
}

}

function autoPick(){

  state.owned.forEach(o=>{const c=cardOf(o);if(!c||c.co)return;if(!best[c.h]||eff(o)>eff(best[c.h]))best[c.h]=o});
  const pool=Object.values(best).sort((a,b)=>eff(b)-eff(a)).slice(0,18);
  function assign(cs){
    const res=[null,null,null,null,null];const used=new Array(cs.length).fill(false);
    function bt(slot){
      if(slot===5)return true;
      for(let k=0;k<cs.length;k++){if(used[k])continue;
        if(slotOK(cardOf(cs[k]).r,slot)){used[k]=true;res[slot]=cs[k];if(bt(slot+1))return true;used[k]=false}}
      return false;
    }
    return bt(0)?res:null;
  }
  if(pool.length<5){
    state.squad=[null,null,null,null,null];state.subs=[null,null];
    pool.forEach(o=>{const c=cardOf(o);const tgt=targetSlot(c);if(tgt>=0&&tgt<5)state.squad[tgt]=o.uid;else if(tgt===5){const j=state.subs.indexOf(null);if(j>=0)state.subs[j]=o.uid}});
    return;
  }
  let bestSet=null,bestVal=-1e9;const n=pool.length;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++)for(let e=d+1;e<n;e++){
    const cs=[pool[a],pool[b],pool[c],pool[d],pool[e]];
    const arr=assign(cs);if(!arr)continue;
    const s=strengthOf(cs).total;if(s>bestVal){bestVal=s;bestSet=arr}
  }
  if(!bestSet)return;
  state.squad=bestSet.map(o=>o.uid);
  const chosen=new Set(state.squad);
  const rest=pool.filter(o=>!chosen.has(o.uid));
  state.subs=[rest[0]?rest[0].uid:null,rest[1]?rest[1].uid:null];
}

function rollRarity(odds){
  const ent=Object.entries(odds);const tot=ent.reduce((a,[,v])=>a+v,0);let x=Math.random()*tot;
  for(const [k,v] of ent){x-=v;if(x<=0)return k}return ent[0][0];
}
function pickCard(filter,rar,exclude){

  const order=[i,i-1,i+1,i-2,i+2,i-3,i+3,i-4,i+4].filter(j=>j>=0&&j<5);
  for(const j of order){const cand=BY_RAR[RKEYS[j]].filter(c=>filter(c)&&!exclude.has(c.id));if(cand.length)return cand[Math.floor(Math.random()*cand.length)]}

  state.lastMatch={netOpp:{name:B.name,tag:B.tag,c1:clamp(Math.round(+doc.c1)||0,0,PALETTE.length-1),c2:clamp(Math.round(+doc.c2)||0,0,PALETTE.length-1),shape:SHAPES.includes(doc.shape)?doc.shape:"shield",pat:PATTERNS.includes(doc.pat)?doc.pat:"none"},bo,R,delta,reward,tourMsg:promoN,fresh:true,tourName:"Online ladder",backTo:"online"};
  state.view="match";save();render();
}

/* ---------- VFL events ---------- */
const tierName=t=>t.real?(t.tier===3?"Tier 1":"Tier 2"):TIERS[t.tier].name;
function rewardFor(opp,won){
  let base=won?Math.round(70+Math.max(0,opp.rating-900)*.5):40;
  if(won&&opp.rating<state.me.rating-250)base=Math.round(base*.4);
  return base;
}
const DIV_NAMES=["Division IV","Division III","Division II","Division I","Masters"];
function divPromo(){
  const idx=DIV_NAMES.indexOf(division(state.me.rating));
  if(idx>(state.bestDiv||0)){const bonus=[0,400,800,1500,3000][idx];state.bestDiv=idx;state.credits+=bonus;return `Promoted to ${DIV_NAMES[idx]}! +${bonus} cr bonus`}
  return "";
}
const TOURS=[
  {id:"regional",name:"VFL Regional League",size:4,bo:1,minRating:0,regional:true,prize:[900,350,150],desc:"4-team domestic bracket against the clubs of your home region, all Bo1. Import rules apply: at most 2 starters from outside your region."},
  {id:"masters",name:"VFL Masters",size:4,bo:3,minRating:0,prize:[2500,1000,400],desc:"4-team international bracket. Every series is a Bo3. Any lineup allowed."},
  {id:"champions",name:"VFL Champions",size:8,bo:3,minRating:1250,prize:[5000,2000,900,400],desc:"8-team international bracket. Every series is a Bo3. Needs a rating of 1250."}
];
function startTour(id){
  const T=TOURS.find(t=>t.id===id);if(!T||state.tour||state.me.rating<T.minRating||!myStrength())return;
  if(T.regional&&importCount()>2)return;
  let cand=state.teams.slice();
  if(T.regional)cand=cand.filter(t=>t.region===state.club.region);
  const opp=cand.sort((x,y)=>Math.abs(x.rating-state.me.rating)-Math.abs(y.rating-state.me.rating)).slice(0,T.size-1+2).sort(()=>Math.random()-.5).slice(0,T.size-1);
  const seeds=["ME",...opp.map(t=>t.id)].sort(()=>Math.random()-.5);
  state.tour={id,name:T.name,bo:T.bo,round:0,alive:seeds,results:[],done:false,place:null};
  state.view="events";
}
const roundName=(n)=>n===2?"Grand final":n===4?"Semifinals":"Quarterfinals";
function tourPairs(){const a=state.tour.alive;const p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);return p}
function advanceTour(myWon){
  const tr=state.tour;const T=TOURS.find(t=>t.id===tr.id);const bo=tr.bo||3;const pairs=tourPairs();const next=[];const rn=roundName(tr.alive.length);
  pairs.forEach(([x,y])=>{
    if(x==="ME"||y==="ME"){const o=x==="ME"?y:x;next.push(myWon?"ME":o);tr.results.push({rn,a:"ME",b:o,w:myWon?"ME":o})}
    else{const X=state.teams.find(t=>t.id===x),Y=state.teams.find(t=>t.id===y);const xw=quickSeries(X,Y,bo);next.push(xw?x:y);tr.results.push({rn,a:x,b:y,w:xw?x:y})}
  });
  const size=tr.alive.length;tr.alive=next;
  if(!myWon){
    const placeIdx=size===2?1:size===4?2:3;const prize=T.prize[placeIdx]||0;state.credits+=prize;tr.done=true;tr.place=size===2?"Runner-up":size===4?"Semifinalist":"Quarterfinalist";tr.prize=prize;
    while(tr.alive.length>1){const pr=tourPairs();const nx=[];pr.forEach(([x,y])=>{const X=state.teams.find(t=>t.id===x),Y=state.teams.find(t=>t.id===y);const xw=quickSeries(X,Y,bo);nx.push(xw?x:y);tr.results.push({rn:roundName(tr.alive.length),a:x,b:y,w:xw?x:y})});tr.alive=nx}
    return `${T.name}: ${tr.place}, +${prize} credits`;
  }
  if(tr.alive.length===1){const prize=T.prize[0];state.credits+=prize;tr.done=true;tr.place="Champion";tr.prize=prize;state.trophies=(state.trophies||[]).concat([{name:T.name,at:new Date().toISOString().slice(0,10)}]);return `${T.name} champions! +${prize} credits`}
  return `Through to the ${roundName(tr.alive.length).toLowerCase()}`;
}
function ladder(){
  const rows=state.teams.map(t=>({...t,you:false}));
  if(state.club)rows.push({...state.club,id:"ME",you:true,rating:state.me.rating,w:state.me.w,l:state.me.l,tier:-1});
  return rows.sort((x,y)=>y.rating-x.rating);
}

    ${rows.map((t,i)=>`<tr class="${t.you?"me":""}"><td class="num">${i+1}</td><td><span class="tcell">${crest(t,30)}${t.you?`<span>${esc(t.name)}</span>`:`<button class="linkish" data-action="team" data-v="${t.id}">${esc(t.name)}</button>`}</span></td>
      <td class="hide-sm">${t.you?'<span class="pill you">You</span>':`<span class="pill ${t.real?(t.tier===3?"t3":"t2"):"t"+t.tier}">${tierName(t)}</span>`}</td><td class="r num">${t.w}–${t.l}</td><td class="r num">${t.rating}</td></tr>`).join("")}
    </tbody></table></div></section>
    <section class="panel"><h3>Your recent series</h3><div class="feed">${feed||'<span class="muted">No matches played yet.</span>'}</div></section>`;
}

/* ---------- render ---------- */
function render(){
  if(!window.__vflTick||Date.now()-window.__vflTick>30000){window.__vflTick=Date.now();if(state&&state.owned){restTick();if(state.schedule&&schedTick())save()}}
  const tabs=[["club","Club"],["packs","Packs"],["collection","Cards"],["play","Play"],["events","Events"],["online","Online"],["ladder","Ladder"]];
  const cur=state.view==="match"?(state.lastMatch?.tourName?"events":"play"):state.view==="prematch"?(state.prematch?.kind==="tour"?"events":state.prematch?.kind==="net"?"online":"play"):state.view==="team"?"ladder":state.view;
  document.getElementById("tabs").innerHTML=tabs.map(([k,l])=>`<button data-action="nav" data-v="${k}" ${cur===k?'aria-current="page"':""} ${!state.club&&k!=="club"?"disabled":""}>${l}</button>`).join("");
  document.getElementById("wallet").innerHTML=state.club?`<b>${state.credits}</b> cr · ${state.me.rating}`:"";
  const app=document.getElementById("app");
  app.innerHTML=({club:viewClub,packs:viewPacks,collection:viewCollection,play:viewPlay,events:viewEvents,online:viewOnline,ladder:viewLadder,match:viewMatch,prematch:viewPrematch,team:viewTeam}[state.view]||viewClub)();
  if(state.view==="online")fillNames();
  if(state.view==="match"&&state.lastMatch?.fresh)animateMatch();
  if(state.view==="packs"&&state.lastPack?.fresh)animatePack();
}
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function animatePack(){
  state.lastPack.fresh=false;save();
  const els=[...document.querySelectorAll("#reveal [data-ri]")];
  if(reduced()){els.forEach(e=>e.classList.remove("hidden"));return}
  els.forEach((e,i)=>{const last=i===els.length-1;setTimeout(()=>e.classList.remove("hidden"),300+i*(last?520:360)+(last?300:0))});
}
function addToSquad(uid){
  const o=ownedBy(uid);if(!o||inSquad(uid)||squadHandles().has(cardOf(o).h))return;
  const tgt=targetSlot(cardOf(o));
  if(tgt>=0&&tgt<5)state.squad[tgt]=uid;
  else if(tgt===5){const j=state.subs.indexOf(null);if(j>=0)state.subs[j]=uid}
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-action]");if(!el||el.disabled)return;
  const act=el.dataset.action,v=el.dataset.v;
  if(act!=="reset")state.resetArm=false;
  switch(act){
    case"nav":state.view=v;if(v!=="packs"&&state.lastPack)state.lastPack.fresh=false;window.scrollTo(0,0);break;
    case"c1":case"c2":state.draft[act]=+v;break;
    case"shape":state.draft.shape=v;break;
    case"pat":state.draft.pat=v;break;
    case"regionsel":state.draft.region=v;break;
    case"clubregion":state.club.region=v;break;
    case"create":{
      const d=state.draft;const name=d.name.trim();const tag=d.tag.trim().toUpperCase();const err=document.getElementById("create-err");
      if(!name){err.textContent="Give your club a name.";return}
      if(!/^[A-Z0-9]{2,4}$/.test(tag)){err.textContent="The tag needs 2 to 4 letters or numbers.";return}
      state.club={name,tag,c1:d.c1,c2:d.c2,shape:d.shape,pat:d.pat||"none",region:d.region||"Americas"};starterPack();state.view="packs";window.scrollTo(0,0);break;
    }
    case"open":openPack(v);window.scrollTo(0,0);break;
    case"closepack":state.lastPack=null;break;
    case"add":addToSquad(+v);break;
    case"sell":{const o=ownedBy(+v);if(!o||inSquad(o.uid))return;state.credits+=RAR[cardOf(o).rar].sell;state.owned=state.owned.filter(x=>x.uid!==o.uid);break}
    case"unslot":(el.dataset.w==="squad"?state.squad:state.subs)[+v]=null;break;
    case"bench":{const i=+v;const j=state.subs.indexOf(null);const u=state.squad[i];if(j>=0){state.subs[j]=u;state.squad[i]=null}else{state.squad[i]=state.subs[0];state.subs[0]=u}break}
    case"promote":{const i=+v;const u=state.subs[i];const c=cardOf(ownedBy(u));if(!c)break;
      const pref=c.r!=="Flex"?[SLOT_ROLES.indexOf(c.r),4,0,1,2,3]:[4,0,1,2,3];
      let tgt=-1;
      for(const s of pref){if(s>=0&&slotOK(c.r,s)&&!state.squad[s]){tgt=s;break}}
      if(tgt<0){for(const s of pref){if(s>=0&&slotOK(c.r,s)){tgt=s;break}}}
      if(tgt<0)break;
      state.subs[i]=state.squad[tgt];state.squad[tgt]=u;break}
    case"autopick":autoPick();break;
    case"setcoach":state.coach=+v;break;
    case"uncoach":state.coach=null;break;
    case"coachfilter":state.view="collection";state.filter.role="Coach";state.filter.scope="owned";break;
    case"pickslot":{const i=+v;state.view="collection";state.filter.scope="owned";state.filter.role=i<4?SLOT_ROLES[i]:"All";state.filter.limit=60;window.scrollTo(0,0);break}
    case"tourstart":startTour(v);window.scrollTo(0,0);break;
    case"tourplay":openPrematch("tour",v,(state.tour&&state.tour.bo)||3,state.tour.name);return;
    case"tourclose":state.tour=null;break;
    case"netplay":openPrematch("net",v,+el.dataset.bo===3?3:1);return;
    case"skip":window.__vflFinish&&window.__vflFinish();return;
    case"pmstart":{const pm=state.prematch;if(!pm)break;state.prematch=null;
      if(pm.kind==="tour")playMatch(pm.id,{bo:pm.bo,tourName:pm.tourName});
      else if(pm.kind==="net")playNet(pm.id,pm.bo);
      else playMatch(pm.id);
      window.scrollTo(0,0);return}
    case"team":state.teamView=v;state.view="team";window.scrollTo(0,0);break;
    case"pmback":{const pm=state.prematch;state.prematch=null;state.view=pm?(pm.kind==="tour"?"events":pm.kind==="net"?"online":"play"):"play";break}
    case"applyread":{const pm=state.prematch;if(!pm)break;const r=pm.reads[+v];if(!r||r.applied||r.sub==null)break;
      const u=state.subs[r.sub];if(!u)break;
      state.subs[r.sub]=state.squad[r.slot];state.squad[r.slot]=u;r.applied=true;
      pm.reads.forEach(x=>{if(x!==r)x.sub=null});break}
    case"autopick-go":autoPick();break;
    case"filter":state.filter[el.dataset.k]=v;state.filter.limit=60;break;
    case"more":state.filter.limit+=60;break;
    case"play":openPrematch("ladder",v);return;
    case"reset":if(!state.resetArm){state.resetArm=true;break}state=fresh();break;
    default:return;
  }
  save();render();
});
document.addEventListener("change",e=>{
  if(e.target.id==="sort-sel"){state.filter.sort=e.target.value;state.filter.limit=60;save();render()}
});
let qTimer;
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="q"){clearTimeout(qTimer);qTimer=setTimeout(()=>{state.filter.q=el.value;state.filter.limit=60;save();render();const n=document.getElementById("q");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},220);return}
  if(el.id==="club-name")state.draft.name=el.value;else if(el.id==="club-tag")state.draft.tag=el.value.toUpperCase();else return;
  const pv=document.getElementById("crest-preview");if(pv)pv.innerHTML=crest(state.draft,140);
});

  authDomain:"valorant-fantasy-league-dac22.firebaseapp.com",
  projectId:"valorant-fantasy-league-dac22",
  storageBucket:"valorant-fantasy-league-dac22.firebasestorage.app",
  messagingSenderId:"815141119699",
  appId:"1:815141119699:web:5c68e3950c228f06dbd626"
};
const net={api:null,user:null,myId:null,clubs:[],ready:false,err:null,mode:null};
let syncT=null;
function queueSync(){if(!net.ready||!state||!state.club)return;clearTimeout(syncT);syncT=setTimeout(syncClub,2500)}
async function syncClub(){
  if(!net.ready||!net.myId||!state.club)return;
  try{
    const doc={name:String(state.club.name).slice(0,28),tag:state.club.tag,c1:state.club.c1,c2:state.club.c2,shape:state.club.shape,pat:state.club.pat||"none",region:state.club.region||"Americas",
      rating:state.me.rating,w:state.me.w,l:state.me.l,
      squad:state.squad.map(u=>ownedBy(u)).filter(Boolean).map(o=>({cid:o.cid,form:o.form||0})),
      coachCid:(cardOf(ownedBy(state.coach))||{}).id||null,up:Date.now()};
    await net.api.doc("clubs/"+net.myId).set(doc);
  }catch(e){}
}
function subscribeClubs(){
  let to=setTimeout(()=>{if(!net.ready){net.err="The leaderboard is taking too long to load.";if(state.view==="online")render()}},10000);
  net.api.collection("clubs").orderBy("rating","desc").limit(100).onSnapshot(s=>{
    clearTimeout(to);
    const ds=(s&&s.docs)?s.docs:(Array.isArray(s)?s:[]);
    net.clubs=ds.map(d=>{try{return Object.assign({id:d.id},(typeof d.data==="function"?d.data():d))}catch(e){return null}}).filter(x=>x&&x.id);
    net.ready=true;net.err=null;
    if(state.view==="online")render();
  },e=>{clearTimeout(to);net.err="Couldn't reach the leaderboard.";if(state.view==="online")render()});
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("failed "+src));document.head.appendChild(s)})}
async function initFirebase(){
  const V="10.14.1";
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
  firebase.initializeApp(FB_CONFIG);
  const cred=await firebase.auth().signInAnonymously();
  net.myId=(cred&&cred.user&&cred.user.uid)||(firebase.auth().currentUser&&firebase.auth().currentUser.uid);
  if(!net.myId)throw new Error("no uid");
  net.api=firebase.firestore();net.user=null;net.mode="firebase";
  subscribeClubs();queueSync();
}
async function initNet(){
  // 1) claude.ai artifact services, when this page runs in the artifact viewer
  if(window.claude&&window.claude.use){
    try{
      const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
      if(db&&user){
        net.api=db;net.user=user;net.myId=await user.id();net.mode="artifact";
        subscribeClubs();queueSync();return;
      }
    }catch(e){}
  }
  // 2) Firebase, when hosted on the public site
  try{
    if(FB_CONFIG.apiKey){await initFirebase();return}
  }catch(e){}
  net.err="Online play isn't available in this view. It works on the claude.ai page while signed in, or on the public site.";
  if(state.view==="online")render();
}
async function fillNames(){
  if(!net.user)return;
  const els=[...document.querySelectorAll("[data-owner]")];if(!els.length)return;
  try{const ids=[...new Set(els.map(e=>e.dataset.owner))];const ps=await net.user.profiles(ids);
    els.forEach(e=>{const p=ps&&ps[e.dataset.owner];const n=(p&&p.name)||"";e.textContent=n?("by "+n):""});}catch(e){}
}
function start(data){
  state=(data&&data.teams&&data.owned)?data:(load()||fresh());
  // drop cards that no longer exist after a data update
  state.owned=state.owned.filter(o=>CARD[o.cid]);
  if(state.coach===undefined)state.coach=null;if(state.tour===undefined)state.tour=null;if(!state.trophies)state.trophies=[];
  state.teams.forEach((tm,i)=>{if(!tm.fmt)tm.fmt=Math.random()<.28?3:1;if(!tm.region)tm.region=REGIONS[i%4];if(!tm.pat)tm.pat="none";tm.players.forEach(p=>{if(p.men==null){p.men=60+Math.floor(Math.random()*30);p.sta=62+Math.floor(Math.random()*28)}})});
  if(state.club){if(!state.club.region)state.club.region="Americas";if(!state.club.pat)state.club.pat="none"}
  if(state.draft){if(!state.draft.pat)state.draft.pat="none";if(!state.draft.region)state.draft.region="Americas"}
  if(state.tour&&!state.tour.bo)state.tour.bo=3;
  if(!state.slotV){const bad=state.squad.some((u,i)=>{const c=cardOf(ownedBy(u));return c&&!slotOK(c.r,i)});if(bad)seatSquad();state.slotV=1}
  if(!state.ladderV2){state.teams=genTeams();state.tour=null;state.ladderV2=1}
  if(state.bestDiv==null)state.bestDiv=Math.max(0,["Division IV","Division III","Division II","Division I","Masters"].indexOf(division(state.me.rating)));
  if(!state.lastRest)state.lastRest=Date.now();
  if(!state.schedule)state.schedule=[];
  if(!state.schedDays)state.schedDays={};
  restTick();ensureSchedule();simDue();
  if(state.lastMatch&&!state.lastMatch.R)state.lastMatch=null;
  if(state.coach!==null&&!ownedBy(state.coach))state.coach=null;
  state.squad=state.squad.map(u=>ownedBy(u)?u:null);state.subs=state.subs.map(u=>ownedBy(u)?u:null);
  document.getElementById("datanote").textContent=DATA_NOTE;
  render();
  if(!window.__netInit){window.__netInit=1;initNet()}
}
try{window.claude?.hot?.snapshot?.(()=>state)}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
